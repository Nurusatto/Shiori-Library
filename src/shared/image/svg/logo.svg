<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Определяем мягкое свечение для коралловых элементов, чтобы они 'горели' на черном -->
    <filter id="glow-shiori" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Вся иконка заключена в группу для центрирования -->
  <g transform="translate(10, 10)">
    
    <!-- Основной контур книги, цвет Cyan-White для контраста на черном -->
    <path d="M 70 140 C 40 140, 10 130, 0 125 L 0 15 C 10 20, 40 30, 70 30 C 100 30, 130 20, 140 15 L 140 125 C 130 130, 100 140, 70 140 Z" 
          fill="none" 
          stroke="#E0F7FA" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Центральный разделитель страниц -->
    <line x1="70" y1="30" x2="70" y2="140" 
          stroke="#E0F7FA" 
          stroke-width="8" 
          stroke-linecap="round"/>
    
    <!-- Элементы закладки: Веревочка -->
    <g filter="url(#glow-shiori)">
      <path d="M 70 15 C 70 -10, 110 -10, 110 25" 
            fill="none" 
            stroke="#FF7043" 
            stroke-width="6" 
            stroke-linecap="round"/>
      
      <!-- Элементы закладки: Сама закладка с Шеврон-узором -->
      <path d="M 95 25 L 125 25 L 125 145 C 125 145, 110 135, 110 135 C 110 135, 95 145, 95 145 L 95 25 Z" 
            fill="#FF7043"/>
      
      <!-- Узор Шеврон на закладке -->
      <path d="M 102 45 L 110 52 L 118 45 M 102 65 L 110 72 L 118 65 M 102 85 L 110 92 L 118 85 M 102 105 L 110 112 L 118 105" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>
</svg>
